apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${CSC_PROJECT}
  labels:
    app: ${CSC_PROJECT}
spec:
  selector:
    matchLabels:
      app: ${CSC_PROJECT}
  template:
    metadata:
      labels:
        app: ${CSC_PROJECT}
    spec:
      containers:
        - name: ${CSC_PROJECT}
          image: image-registry.openshift-image-registry.svc:5000/${CSC_PROJECT}/sanuli-webapp:dev
          ports:
            - containerPort: 8080
  replicas: 1
  strategy:
    type: RollingUpdate
  paused: false
  revisionHistoryLimit: 5
  minReadySeconds: 0
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ${CSC_PROJECT}
  name: ${CSC_PROJECT}
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: ${CSC_PROJECT}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: ${CSC_PROJECT}
  name: ${CSC_PROJECT}
spec:
  to:
    kind: Service
    name: ${CSC_PROJECT}
    weight: 100
  port:
    targetPort: 8080