---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  labels:
    app: ${CSC_PROJECT}
  name: ${CSC_PROJECT}
  namespace: dev
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  labels:
    app: ${CSC_PROJECT}
  name: ${CSC_PROJECT}
spec:
  source: 
    binary: {}
  output:
    to:
      kind: ImageStreamTag
      name: image-registry.apps.2.rahti.csc.fi/${CSC_PROJECT}/${CSC_PROJECT}:dev
  strategy:
    dockerStrategy: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${CSC_PROJECT}
  namespace: dev
  labels:
    app: ${CSC_PROJECT}
spec:
  selector:
    matchLabels:
      app: ${CSC_PROJECT}
  template:
    metadata:
      labels:
        app: ${CSC_PROJECT}
    spec:
      containers:
        - name: ${CSC_PROJECT}
          image: image-registry.apps.2.rahti.csc.fi/${CSC_PROJECT}/${CSC_PROJECT}:dev
          ports:
            - containerPort: 8080
  replicas: 1
  strategy:
    type: RollingUpdate
  paused: false
  revisionHistoryLimit: 5
  minReadySeconds: 0
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ${CSC_PROJECT}
  name: ${CSC_PROJECT}
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: ${CSC_PROJECT}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  labels:
    app: ${CSC_PROJECT}
  name: ${CSC_PROJECT}
spec:
  to:
    kind: Service
    name: ${CSC_PROJECT}
    weight: 100